<style>

:root{--bg:#F6F4EF;--surface:#FFFFFF;--ink:#1B2447;--muted:#5E6782;--line:#E1DCCF;--seal:#C8413A;--gold:#C58A1E;--soft:#FBE9E6;

*{box-sizing:border-box}
html{scroll-padding-top:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.seal{width:42px;height:42px;border-radius:8px;background:var(--seal);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--f-ko);font-weight:700;font-size:13px;line-height:1.05;transform:rotate(-5deg);flex:none}
h1{font-family:var(--f-disp);font-size:24px;line-height:1.15;margin:0}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
.focus{background:var(--ink);color:#F6EDDA;border-radius:18px;padding:20px 20px 22px;margin-bottom:26px}
.focus .k{font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.focus h2{font-family:var(--f-disp);font-size:26px;margin:4px 0 14px;line-height:1.15}
.play{display:flex;align-items:center;gap:14px;background:var(--seal);color:#fff;border:0;border-radius:40px;padding:12px 22px 12px 14px;font:inherit;font-weight:900;font-size:17px;cursor:pointer}
.play i{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.play i::before{content:"";border-left:14px solid var(--seal);border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.play.is-playing i::before{border:0;width:12px;height:14px;margin:0;border-left:4px solid var(--seal);border-right:4px solid var(--seal)}
.play:focus-visible,.row button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.focus ol{margin:16px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 16px}
.focus ol.one{grid-template-columns:1fr}
.focus li{display:flex;flex-direction:column;border-bottom:1px solid rgba(246,237,218,.18);padding:4px 0}
.focus li b{font-family:var(--f-ko);font-size:22px;font-weight:700}
.focus li span{font-size:13px;opacity:.8}
.soon{margin-top:12px;font-size:14px;color:var(--gold);font-weight:800}
.tabs{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.tabs button{font:inherit;font-weight:800;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;padding:6px 14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h3{font-family:var(--f-disp);font-size:18px;margin:22px 0 8px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;scroll-margin-top:16px}
.row.is-target{border-color:var(--seal);box-shadow:0 0 0 2px var(--seal) inset}
.row button{width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
.row button::before{content:"";border-left:12px solid var(--seal);border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:3px}
.row button.is-playing::before{border:0;width:10px;height:12px;margin:0;border-left:3px solid var(--seal);border-right:3px solid var(--seal)}
.row button:disabled{opacity:.35;cursor:default}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:15px}
.row .t span{display:block;font-family:var(--f-ko);font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer{margin-top:34px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
</head>

<section class="focus" id="focus" hidden>

  <ol id="f-lines"></ol>
</section>
<div class="tabs" role="group" aria-label="Producto">
  <button type="button" data-p="wb" aria-pressed="true">Cuaderno</button>
  <button type="button" data-p="tc" aria-pressed="false">Tarjetas</button>
</div>
<main id="list"></main>
<footer>Escanea los códigos QR de tu cuaderno o de tus tarjetas para ir directo a cada audio. Consejo: escucha, pausa y repite en voz alta.</footer>

const EXT = ['m4a', 'mp3'];
const player = new Audio();
let current = null, prod = 'wb';
const avail = {};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function findSrc(id){
  if (id in avail) return avail[id];
  for (const x of EXT){
    try { const r = await fetch(`audio/${id}.${x}`, {method:'HEAD'}); if (r.ok){ return avail[id] = `audio/${id}.${x}`; } } catch(e){}
  }
  return avail[id] = null;
}
function setPlaying(id, on){
  document.querySelectorAll(`[data-id="${id}"]`).forEach(b=>b.classList.toggle('is-playing', on));
  if (focusId === id){ document.getElementById('f-play').classList.toggle('is-playing', on); document.getElementById('f-lab').textContent = on ? 'Pausa' : 'Escuchar'; }
}
async function toggle(id){
  if (current === id && !player.paused){ player.pause(); return; }
  const src = await findSrc(id);
  if (!src){ if (focusId === id) document.getElementById('f-soon').hidden = false; markMissing(id); return; }
  if (current && current !== id) setPlaying(current, false);
  if (current !== id){ player.src = src; current = id; }
  player.play().catch(()=>{});
}
player.addEventListener('play', ()=> current && setPlaying(current, true));
player.addEventListener('pause', ()=> current && setPlaying(current, false));
player.addEventListener('ended', ()=> current && setPlaying(current, false));
function markMissing(id){ document.querySelectorAll(`.row [data-id="${id}"]`).forEach(b=>{ b.disabled = true; b.title = 'Disponible muy pronto'; }); }
function secName(t){ return t.prod === 'tc' ? 'Tarjetas de vocabulario' : t.sec; }
function renderList(){
  let h = '', last = '';
  for (const t of TRACKS.filter(t=>t.prod===prod)){
    const s = secName(t);
    if (s !== last){ h += `<h3>${esc(s)}</h3>`; last = s; }
    const words = t.lines.slice(0, 6).map(l=>l[0]).join(' · ');
    h += `<div class="row" data-row="${t.id}"><button type="button" data-id="${t.id}" aria-label="Escuchar ${esc(t.es)}"></button><div class="t"><b>${esc(t.es)}</b><span>${esc(words)}</span></div></div>`;
  }
  document.getElementById('list').innerHTML = h;
}
let focusId = null;
function showFocus(id){
  const t = TRACKS.find(x=>x.id===id);
  const box = document.getElementById('focus');
  if (!t){ box.hidden = true; focusId = null; return; }
  focusId = id;
  document.getElementById('f-k').textContent = (t.prod === 'tc' ? 'Tarjetas de vocabulario' : 'Hangul en 14 días · ' + t.sec);
  document.getElementById('f-t').textContent = t.es;
  document.getElementById('f-lines').classList.toggle('one', t.lines.some(l => l[0].length > 7));
  document.getElementById('f-lines').innerHTML = t.lines.map(([k,n])=>`<li><b>${esc(k)}</b>${n?`<span>${esc(n)}</span>`:''}</li>`).join('');
  document.getElementById('f-soon').hidden = true;
  box.hidden = false;
  if (t.prod !== prod){ prod = t.prod; syncTabs(); renderList(); }
  document.querySelectorAll('.row').forEach(r=>r.classList.toggle('is-target', r.dataset.row===id));
  findSrc(id).then(s=>{ if(!s) document.getElementById('f-soon').hidden = false; });
  window.scrollTo(0, 0);
}
function syncTabs(){ document.querySelectorAll('[data-p]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.p===prod)); }
document.addEventListener('click', e=>{
  const p = e.target.closest('[data-p]');
  if (p){ prod = p.dataset.p; syncTabs(); renderList(); return; }
  const b = e.target.closest('.row [data-id]');
  if (b){ toggle(b.dataset.id); return; }
  if (e.target.closest('#f-play') && focusId) toggle(focusId);
});
renderList();
const h = decodeURIComponent(location.hash.slice(1));
if (h) showFocus(h);
window.addEventListener('hashchange', ()=>showFocus(decodeURIComponent(location.hash.slice(1))));
</script>
